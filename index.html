<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooler Subs</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px;
    line-height: 1.5;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 24px;
    color: #58a6ff;
  }
  .row {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .row-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .row-line {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .url {
    flex: 1;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 10px;
    color: #8b949e;
    font-family: monospace;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  button {
    background: #238636;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #2ea043; }
  button.copied { background: #1f6feb; }
</style>
</head>
<body>
  <h1>Cooler Subs</h1>

  <div class="row">
    <div class="row-title">⚫ Чёрный список</div>
    <div class="row-line">
      <input class="url" readonly
        value="https://raw.githubusercontent.com/regionovec-jpg/subs_pars/refs/heads/main/subs_bl.txt">
      <button onclick="copy(this)">Копировать</button>
    </div>
  </div>

  <div class="row">
    <div class="row-title">⚪ Белый список</div>
    <div class="row-line">
      <input class="url" readonly
        value="https://raw.githubusercontent.com/regionovec-jpg/subs_pars/refs/heads/main/subs_wl.txt">
      <button onclick="copy(this)">Копировать</button>
    </div>
  </div>

  <div class="row">
    <div class="row-title">⚫ Clash YAML (чёрный)</div>
    <div class="row-line">
      <input class="url" readonly
        value="https://raw.githubusercontent.com/regionovec-jpg/subs_pars/refs/heads/main/subs_bl.yaml">
      <button onclick="copy(this)">Копировать</button>
    </div>
  </div>

  <div class="row">
    <div class="row-title">⚪ Clash YAML (белый)</div>
    <div class="row-line">
      <input class="url" readonly
        value="https://raw.githubusercontent.com/regionovec-jpg/subs_pars/refs/heads/main/subs_wl.yaml">
      <button onclick="copy(this)">Копировать</button>
    </div>
  </div>

  <script>
    function copy(btn) {
      const input = btn.parentElement.querySelector('.url');
      input.select();
      input.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(input.value).then(() => {
        btn.textContent = '✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Копировать';
          btn.classList.remove('copied');
        }, 1200);
      });
    }
  </script>
</body>
</html>
